name: Bootstrap dependency lockfile

on:
  push:
    branches:
      - feat/17-secure-receipt-upload

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfile-receipt-upload
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Update pnpm lockfile for prototype dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependency graph without running install scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile for Supabase upload"
          git push origin "HEAD:${GITHUB_REF_NAME}"
