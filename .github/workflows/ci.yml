name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-github-yaml:
    name: Validate GitHub YAML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate YAML files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path); puts "Valid YAML: #{path}" }' $(find .github -type f -name '*.yml' -print)
